# Publishes the teob-cc fork as cc.teob to Sonatype Central.
# Same secrets as teob-cc/cats-effect: SONATYPE_USER, SONATYPE_PASSWORD, GPG_SECRET, GPG_PASS.
# Not generated by sbt-typelevel (unlike ci.yml), so githubWorkflowCheck leaves it alone.

name: Release cc.teob to Sonatype

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.23.19-teob.1'
        required: true
      run_tests:
        description: 'Run tests before publishing'
        type: boolean
        default: true
      dry_run:
        description: 'Build, sign and stage everything, but do not upload to Central or tag'
        type: boolean
        default: false

permissions:
  contents: write # pushes the release tag

concurrency:
  group: teob-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TEOB_VERSION: ${{ inputs.version }}
      # the default JIT code cache on JDK 8 can fill up during the Scala 3 build ("CodeCache is
      # full. Compiler has been disabled"), which slows sbt to a crawl
      SBT_OPTS: -XX:ReservedCodeCacheSize=512m

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # sbt-typelevel derives the version and MiMa baselines from upstream release tags
      - name: Fetch upstream tags
        run: git fetch --no-tags https://github.com/http4s/blaze.git '+refs/tags/v0.*:refs/tags/v0.*'

      - name: Check version is new
        run: |
          if git rev-parse -q --verify "refs/tags/teob-v$TEOB_VERSION" >/dev/null; then
            echo "teob-v$TEOB_VERSION already exists" >&2
            exit 1
          fi

      # Like upstream's CI, build, test and publish on JDK 8: newer JDKs are blocked by
      # http4s/blaze#376, and from 21 on javac warns that release 8 is obsolete, which the
      # build's fatal warnings turn into an error.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Import GPG private key
        env:
          GPG_SECRET: ${{ secrets.GPG_SECRET }}
          GPG_PASS: ${{ secrets.GPG_PASS }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          printf "%s" "$GPG_SECRET" | gpg --batch --passphrase "$GPG_PASS" --import
          # sbt-typelevel signs non-interactively, so drop the passphrase on this throwaway runner
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ { print $5; exit }')
          (echo "$GPG_PASS"; echo; echo) | gpg --command-fd 0 --pinentry-mode loopback --change-passphrase "$KEY"
          gpg --list-secret-keys

      - name: Run tests
        if: inputs.run_tests
        run: sbt '++ 2.13' test

      - name: Publish (all Scala versions) and release
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USER }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          RELEASE_STEP: ${{ inputs.dry_run && 'show ThisBuild / version' || 'tlSonatypeBundleReleaseIfRelevant' }}
        run: sbt +mimaReportBinaryIssues +publish "$RELEASE_STEP"

      - name: List staged artifacts (dry run)
        if: inputs.dry_run
        run: find target/sona-staging -name '*.pom' | sed 's|.*/||' | sort

      - name: Tag release
        if: ${{ !inputs.dry_run }}
        run: |
          git tag "teob-v$TEOB_VERSION"
          git push origin "teob-v$TEOB_VERSION"
